[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bay-area-uam-link-quality-simulator"
version = "0.1.0"
description = "Reproducible SF-SJ UAM corridor, macro-site, link-quality, and simulator toolkit"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyproj>=3.5",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
